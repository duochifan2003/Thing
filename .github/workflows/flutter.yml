name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive Windows assets
        required: true
        type: string
      publish_android:
        description: Publish Android (requires release keystore secrets)
        required: false
        default: false
        type: boolean
      publish_macos:
        description: Publish macOS (requires Developer ID and notarization secrets)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  DMGBUILD_VERSION: 1.6.5

jobs:
  release-gates:
    name: Release credential gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Block Android publication without formal signing
        if: inputs.publish_android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" -a -n "$STORE_PASSWORD" -a -n "$ALIAS" -a -n "$KEY_PASSWORD" || {
            echo 'Android publication is blocked: configure a formal release keystore first.' >&2
            exit 1
          }
      - name: Block macOS publication without notarization
        if: inputs.publish_macos
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          test -n "$IDENTITY" -a -n "$NOTARY_PROFILE" || {
            echo 'macOS publication is blocked: Developer ID and notarization credentials are required.' >&2
            exit 1
          }
      - name: Block Windows publication without Authenticode
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" -a -n "$PASSWORD" || {
            echo 'Windows publication is blocked: Authenticode credentials are required.' >&2
            exit 1
          }
      - name: Block publication without signed release descriptor
        env:
          RELEASE_DESCRIPTOR_PRIVATE_KEY: ${{ secrets.RELEASE_DESCRIPTOR_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_DESCRIPTOR_PRIVATE_KEY" || {
            echo 'Publication is blocked: a controlled release-descriptor signing key is required.' >&2
            exit 1
          }

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-release:
    name: Android signed release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_android
    needs: [test, release-gates]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Decode formal release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Reject debug signing
        run: |
          apksigner verify --verbose build/app/outputs/flutter-apk/app-release.apk
          certs="$(apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -Fq 'CN=Android Debug'; then
            echo 'Android release is debug-signed' >&2
            exit 1
          fi

  macos-release:
    name: macOS signed and notarized release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_macos
    needs: [test, release-gates]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - run: python3 -m pip install "dmgbuild==${DMGBUILD_VERSION}"
      - name: Build, sign, notarize, staple, and validate DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          DMGBUILD_VERSION: ${{ env.DMGBUILD_VERSION }}
        run: scripts/package-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Thing-macos-${{ github.sha }}
          path: flutter/build/Thing-macOS-v*.dmg

  windows:
    name: Windows build
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
          WINDOWS_AUTHENTICODE_SHA256: ${{ vars.WINDOWS_AUTHENTICODE_SHA256 }}
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').Line.Split(':', 2)[1].Trim()
          $appVersion, $appBuild = $version -split '\+', 2
          flutter build windows --release "--dart-define=APP_VERSION=$appVersion" "--dart-define=APP_BUILD=$appBuild" "--dart-define=WINDOWS_AUTHENTICODE_SHA256=$env:WINDOWS_AUTHENTICODE_SHA256"

      - name: Write build provenance
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').Line.Split(':', 2)[1].Trim()
          if ('${{ inputs.release_tag }}' -and '${{ inputs.release_tag }}' -ne "v$($version.Split('+')[0])") {
            throw "Release tag must equal pubspec version: expected v$($version.Split('+')[0])"
          }

      - name: Validate Windows release output
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build/windows/x64/runner/Release'
          $appPath = Join-Path $releaseDir 'Thing.exe'
          if (-not (Test-Path -LiteralPath $releaseDir -PathType Container)) {
            throw "Windows release directory was not found: $releaseDir"
          }
          if (-not (Test-Path -LiteralPath $appPath -PathType Leaf)) {
            throw "Windows executable was not found: $appPath"
          }

      - name: Package Windows release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $zipPath = Join-Path $PWD 'build/Thing-windows-${{ github.sha }}.zip'
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath $zipPath
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Windows ZIP was not created: $zipPath"
          }
          if ([IO.Path]::GetFileName($zipPath) -ne 'Thing-windows-${{ github.sha }}.zip') {
            throw "Windows ZIP has an unexpected name: $zipPath"
          }

      - name: Build Windows installer
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          $releaseTag = $env:RELEASE_TAG
          $version = (Get-Content pubspec.yaml | Select-String '^version:').Line.Split(':', 2)[1].Trim().Split('+')[0]
          if ($releaseTag -and $releaseTag -ne "v$version") { throw "Release tag must equal pubspec version: expected v$version" }
          & $iscc "/DAppVersion=$version" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installerPath = Join-Path $PWD "build/installer/Thing-windows-v$version-setup.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Windows installer was not created with the expected name: $installerPath"
          }

      - name: Sign Windows installer for publication
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE -or -not $env:WINDOWS_SIGNING_PASSWORD) {
            throw 'Windows Authenticode credentials are required before publishing assets.'
          }
          $pfx = Join-Path $PWD 'build/signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          $installer = Get-Item 'build/installer/Thing-windows-*-setup.exe'
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'signtool.exe was not found.' }
          & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool verify /pa /all $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer Authenticode verification failed.' }
          Remove-Item -Force $pfx

      - name: Write and hash release provenance
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').Line.Split(':', 2)[1].Trim()
          $sourceZipName = "Thing-windows-${{ github.sha }}.zip"
          $releaseTag = "${{ inputs.release_tag }}"
          $releaseZipName = if ($releaseTag) { "Thing-windows-$releaseTag.zip" } else { $sourceZipName }
          $zipPath = "build/$sourceZipName"
          $installer = Get-ChildItem build/installer/Thing-windows-*-setup.exe | Select-Object -First 1
          $assets = @(
            @{ path = $releaseZipName; source_path = $sourceZipName; bytes = (Get-Item $zipPath).Length; sha256 = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower() },
            @{ path = $installer.Name; source_path = "installer/$($installer.Name)"; bytes = $installer.Length; sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() }
          )
          $canonicalMain = if ($env:GITHUB_REF -eq 'refs/heads/main') { $env:GITHUB_SHA } else { '' }
          @{ repository = $env:GITHUB_REPOSITORY; commit = $env:GITHUB_SHA; canonical_main = $canonicalMain; version = $version; release_tag = $releaseTag; assets = $assets } |
            ConvertTo-Json -Depth 5 -Compress | Set-Content build/release-provenance.json

      - name: Upload Windows release artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Thing-windows-${{ github.sha }}
          path: |
            flutter/build/Thing-windows-${{ github.sha }}.zip
            flutter/build/installer/Thing-windows-*-setup.exe
            flutter/build/release-provenance.json

  windows-release:
    name: Upload Windows release
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: Thing-windows-${{ github.sha }}
          path: release

      - name: Verify target GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          provenance=$(find release -name release-provenance.json -type f -print -quit)
          [[ -n "$provenance" ]] || { echo 'Missing build provenance manifest' >&2; exit 1; }
          [[ "$(jq -r .commit "$provenance")" == "$GITHUB_SHA" ]] || {
            echo 'Build provenance commit does not match the release commit' >&2
            exit 1
          }
          [[ "$(jq -r .canonical_main "$provenance")" == "$GITHUB_SHA" ]] || {
            echo 'Build provenance was not produced from canonical main' >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must look like v1.2.3: $RELEASE_TAG" >&2
            exit 1
          }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName'
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          release_body=$(jq -r '.body // ""' <<<"$release_json")
          grep -Eq '"algorithm"[[:space:]]*:[[:space:]]*"ed25519"' <<<"$release_body" || {
            echo 'Release body is missing the Ed25519 descriptor signature.' >&2
            exit 1
          }
          grep -Eq '"publicKeyId"[[:space:]]*:[[:space:]]*"thing-release-2026"' <<<"$release_body" || {
            echo 'Release body is missing the pinned descriptor key id.' >&2
            exit 1
          }
          grep -Fq '"signatures"' <<<"$release_body" || {
            echo 'Release body is missing per-asset signatures.' >&2
            exit 1
          }
          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          ref_type=$(jq -r '.object.type' <<<"$ref_json")
          ref_sha=$(jq -r '.object.sha' <<<"$ref_json")
          if [[ "$ref_type" == "tag" ]]; then
            ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq '.object.sha')
          fi
          [[ "$ref_sha" == "$GITHUB_SHA" ]] || {
            echo "Release tag $RELEASE_TAG points to $ref_sha, expected $GITHUB_SHA" >&2
            exit 1
          }
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "Release commit is not canonical main: main=$main_sha build=$GITHUB_SHA" >&2
            exit 1
          }
          target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')
          [[ "$target" == "main" || "$target" == "$GITHUB_SHA" ]] || {
            echo "Release target_commitish is not canonical main: $target" >&2
            exit 1
          }
          version=$(jq -r .version "$provenance")
          [[ "$version" == "${RELEASE_TAG#v}+"* ]] || {
            echo "Provenance version does not match release tag: $version vs $RELEASE_TAG" >&2
            exit 1
          }
          [[ "$(jq -r .release_tag "$provenance")" == "$RELEASE_TAG" ]] || {
            echo 'Provenance release tag does not match target release' >&2
            exit 1
          }
          jq -e '.assets | length == 2' "$provenance" >/dev/null || {
            echo 'Provenance must list exactly the two uploaded assets' >&2
            exit 1
          }
          while IFS= read -r asset; do
            grep -Fq "\"$asset\"" <<<"$release_body" || {
              echo "Release descriptor is missing asset signature: $asset" >&2
              exit 1
            }
          done < <(jq -r '.assets[].path' "$provenance")

      - name: Block unsigned Windows release
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          test -n "$WINDOWS_SIGNING_CERTIFICATE" -a -n "$WINDOWS_SIGNING_PASSWORD" || {
            echo 'Windows Authenticode credentials are required before publishing assets.' >&2
            exit 1
          }

      - name: Validate and prepare Windows release assets
        id: prepare-release-assets
        env:
          BUILD_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          source_zip="release/Thing-windows-${BUILD_SHA}.zip"
          release_zip="release/Thing-windows-${RELEASE_TAG}.zip"
          installer_matches=(release/installer/Thing-windows-v*-setup.exe)

          [[ -f "$source_zip" ]] || { echo "Missing downloaded Windows ZIP: $source_zip" >&2; exit 1; }
          [[ ${#installer_matches[@]} -eq 1 && -f "${installer_matches[0]}" ]] || {
            echo "Expected exactly one downloaded Windows installer under release/installer" >&2
            printf 'Found: %s\n' "${installer_matches[@]}" >&2
            exit 1
          }
          installer_path="${installer_matches[0]}"
          installer_name="$(basename "$installer_path")"
          expected_installer="Thing-windows-v${RELEASE_TAG#v}-setup.exe"
          [[ "$installer_name" == "$expected_installer" ]] || {
            echo "Installer does not match release tag: expected $expected_installer, found $installer_name" >&2
            exit 1
          }
          [[ "$installer_name" =~ ^Thing-windows-v[0-9]+\.[0-9]+\.[0-9]+-setup\.exe$ ]] || {
            echo "Unexpected Windows installer name: $installer_name" >&2
            exit 1
          }

          mv -- "$source_zip" "$release_zip"
          mv -- "$installer_path" "release/$installer_name"
          [[ -f "$release_zip" ]] || { echo "Renamed Windows ZIP is missing: $release_zip" >&2; exit 1; }
          [[ -f "release/$installer_name" ]] || { echo "Prepared Windows installer is missing: release/$installer_name" >&2; exit 1; }
          echo "installer_name=$installer_name" >> "$GITHUB_OUTPUT"

      - name: Validate Windows release assets before upload
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_NAME: ${{ steps.prepare-release-assets.outputs.installer_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_zip="release/Thing-windows-${RELEASE_TAG}.zip"
          installer_matches=(release/Thing-windows-v*-setup.exe)
          [[ -f "$release_zip" ]] || { echo "Windows ZIP to upload is missing: $release_zip" >&2; exit 1; }
          [[ ${#installer_matches[@]} -eq 1 && -f "${installer_matches[0]}" ]] || {
            echo "Expected exactly one Windows installer to upload" >&2
            exit 1
          }
          installer_name="$INSTALLER_NAME"
          [[ -f "release/$installer_name" ]] || {
            echo "Windows installer to upload is missing: release/$installer_name" >&2
            exit 1
          }
          while IFS=$'\t' read -r asset expected; do
            asset_path="release/$asset"
            [[ -f "$asset_path" ]] || { echo "Provenance asset is missing: $asset" >&2; exit 1; }
            actual=$(sha256sum "$asset_path" | cut -d' ' -f1)
            [[ "$actual" == "$expected" ]] || {
              echo "Asset SHA-256 mismatch for $asset" >&2
              exit 1
            }
          done < <(jq -r '.assets[] | [.path, .sha256] | @tsv' release/release-provenance.json)
          [[ "$installer_name" =~ ^Thing-windows-v[0-9]+\.[0-9]+\.[0-9]+-setup\.exe$ ]] || {
            echo "Windows installer to upload has an unexpected name: $installer_name" >&2
            exit 1
          }

      - name: Upload Windows package to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "release/Thing-windows-$RELEASE_TAG.zip" --repo "$GITHUB_REPOSITORY"

      - name: Upload Windows installer to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_NAME: ${{ steps.prepare-release-assets.outputs.installer_name }}
        run: gh release upload "$RELEASE_TAG" "release/$INSTALLER_NAME" --repo "$GITHUB_REPOSITORY"
