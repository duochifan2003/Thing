name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the Windows ZIP
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  windows:
    name: Windows build
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').Line.Split(':', 2)[1].Trim()
          $appVersion, $appBuild = $version -split '\+', 2
          flutter build windows --release "--dart-define=APP_VERSION=$appVersion" "--dart-define=APP_BUILD=$appBuild"

      - name: Package Windows release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/Thing-windows-${{ github.sha }}.zip

      - name: Upload Windows release artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Thing-windows-${{ github.sha }}
          path: flutter/build/Thing-windows-${{ github.sha }}.zip

  windows-release:
    name: Upload Windows release
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: Thing-windows-${{ github.sha }}
          path: release

      - name: Rename Windows package for Release
        run: mv "release/Thing-windows-${{ github.sha }}.zip" "release/Thing-windows-${{ inputs.release_tag }}.zip"

      - name: Upload Windows package to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "release/Thing-windows-${{ inputs.release_tag }}.zip" --repo "$GITHUB_REPOSITORY" --clobber
