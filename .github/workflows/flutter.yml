name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive Windows assets
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.32.8
  DMGBUILD_VERSION: 1.6.5

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  windows:
    name: Windows build
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').Line.Split(':', 2)[1].Trim()
          $appVersion, $appBuild = $version -split '\+', 2
          flutter build windows --release "--dart-define=APP_VERSION=$appVersion" "--dart-define=APP_BUILD=$appBuild"

      - name: Validate Windows release output
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build/windows/x64/runner/Release'
          $appPath = Join-Path $releaseDir 'Thing.exe'
          if (-not (Test-Path -LiteralPath $releaseDir -PathType Container)) {
            throw "Windows release directory was not found: $releaseDir"
          }
          if (-not (Test-Path -LiteralPath $appPath -PathType Leaf)) {
            throw "Windows executable was not found: $appPath"
          }

      - name: Package Windows release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $zipPath = Join-Path $PWD 'build/Thing-windows-${{ github.sha }}.zip'
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath $zipPath
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Windows ZIP was not created: $zipPath"
          }
          if ([IO.Path]::GetFileName($zipPath) -ne 'Thing-windows-${{ github.sha }}.zip') {
            throw "Windows ZIP has an unexpected name: $zipPath"
          }

      - name: Build Windows installer
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          $releaseTag = $env:RELEASE_TAG
          if ($releaseTag) {
            $version = $releaseTag -replace '^v', ''
          } else {
            $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+' ).Matches.Groups[1].Value
          }
          & $iscc "/DAppVersion=$version" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installerPath = Join-Path $PWD "build/installer/Thing-windows-v$version-setup.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Windows installer was not created with the expected name: $installerPath"
          }
          $zipPath = Join-Path $PWD 'build/Thing-windows-${{ github.sha }}.zip'
          $manifestPath = Join-Path $PWD 'build/Thing-windows-${{ github.sha }}.sha256'
          @($zipPath, $installerPath) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($_))"
          } | Set-Content -Encoding ascii $manifestPath

      - name: Upload Windows release artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Thing-windows-${{ github.sha }}
          path: |
            flutter/build/Thing-windows-${{ github.sha }}.zip
            flutter/build/installer/Thing-windows-*-setup.exe
            flutter/build/Thing-windows-${{ github.sha }}.sha256

  windows-release:
    name: Upload Windows release
    if: github.event_name == 'workflow_dispatch'
    needs: [windows, release-provenance, android-release-gate, macos-release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: Thing-windows-${{ github.sha }}
          path: release

      - name: Verify target GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must look like v1.2.3: $RELEASE_TAG" >&2
            exit 1
          }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName'
          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          ref_type=$(jq -r '.object.type' <<<"$ref_json")
          ref_sha=$(jq -r '.object.sha' <<<"$ref_json")
          if [[ "$ref_type" == "tag" ]]; then
            ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq '.object.sha')
          fi
          [[ "$ref_sha" == "$GITHUB_SHA" ]] || {
            echo "Release tag $RELEASE_TAG points to $ref_sha, expected $GITHUB_SHA" >&2
            exit 1
          }

      - name: Validate and prepare Windows release assets
        id: prepare-release-assets
        env:
          BUILD_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          source_zip="release/Thing-windows-${BUILD_SHA}.zip"
          release_zip="release/Thing-windows-${RELEASE_TAG}.zip"
          installer_matches=(release/installer/Thing-windows-v*-setup.exe)

          [[ -f "$source_zip" ]] || { echo "Missing downloaded Windows ZIP: $source_zip" >&2; exit 1; }
          [[ ${#installer_matches[@]} -eq 1 && -f "${installer_matches[0]}" ]] || {
            echo "Expected exactly one downloaded Windows installer under release/installer" >&2
            printf 'Found: %s\n' "${installer_matches[@]}" >&2
            exit 1
          }
          installer_path="${installer_matches[0]}"
          installer_name="$(basename "$installer_path")"
          expected_installer="Thing-windows-v${RELEASE_TAG#v}-setup.exe"
          [[ "$installer_name" == "$expected_installer" ]] || {
            echo "Installer does not match release tag: expected $expected_installer, found $installer_name" >&2
            exit 1
          }
          [[ "$installer_name" =~ ^Thing-windows-v[0-9]+\.[0-9]+\.[0-9]+-setup\.exe$ ]] || {
            echo "Unexpected Windows installer name: $installer_name" >&2
            exit 1
          }

          mv -- "$source_zip" "$release_zip"
          mv -- "$installer_path" "release/$installer_name"
          [[ -f "$release_zip" ]] || { echo "Renamed Windows ZIP is missing: $release_zip" >&2; exit 1; }
          [[ -f "release/$installer_name" ]] || { echo "Prepared Windows installer is missing: release/$installer_name" >&2; exit 1; }
          echo "installer_name=$installer_name" >> "$GITHUB_OUTPUT"

      - name: Validate Windows release assets before upload
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_NAME: ${{ steps.prepare-release-assets.outputs.installer_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_zip="release/Thing-windows-${RELEASE_TAG}.zip"
          installer_matches=(release/Thing-windows-v*-setup.exe)
          [[ -f "$release_zip" ]] || { echo "Windows ZIP to upload is missing: $release_zip" >&2; exit 1; }
          [[ ${#installer_matches[@]} -eq 1 && -f "${installer_matches[0]}" ]] || {
            echo "Expected exactly one Windows installer to upload" >&2
            exit 1
          }
          installer_name="$INSTALLER_NAME"
          [[ -f "release/$installer_name" ]] || {
            echo "Windows installer to upload is missing: release/$installer_name" >&2
            exit 1
          }
          [[ "$installer_name" =~ ^Thing-windows-v[0-9]+\.[0-9]+\.[0-9]+-setup\.exe$ ]] || {
            echo "Windows installer to upload has an unexpected name: $installer_name" >&2
            exit 1
          }

      - name: Upload Windows package to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "release/Thing-windows-$RELEASE_TAG.zip" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Windows installer to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_NAME: ${{ steps.prepare-release-assets.outputs.installer_name }}
        run: gh release upload "$RELEASE_TAG" "release/$INSTALLER_NAME" --repo "$GITHUB_REPOSITORY" --clobber

  release-provenance:
    name: Release provenance gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag, version, and commit
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: //p' flutter/pubspec.yaml | head -n1)
          app_version=${version%%+*}
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          [[ "${RELEASE_TAG#v}" == "$app_version" ]] || { echo "Tag/version mismatch" >&2; exit 1; }
          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          ref_type=$(jq -r '.object.type' <<<"$ref_json")
          ref_sha=$(jq -r '.object.sha' <<<"$ref_json")
          [[ "$ref_type" == tag ]] && ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq '.object.sha')
          [[ "$ref_sha" == "$GITHUB_SHA" ]] || { echo "Tag points to $ref_sha, expected $GITHUB_SHA" >&2; exit 1; }
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          sha256sum flutter/pubspec.yaml

  android-release-gate:
    name: Android release signing gate
    if: github.event_name == 'workflow_dispatch'
    needs: release-provenance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Require authorized release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "$value is required; refusing an unsigned Android release" >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - run: test "$(find build/app/outputs/flutter-apk -name '*.apk' | wc -l)" -eq 1

  macos-release-gate:
    name: macOS signing and notarization gate
    if: github.event_name == 'workflow_dispatch'
    needs: release-provenance
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install pinned DMG builder
        run: python3 -m pip install "dmgbuild==${DMGBUILD_VERSION}"
      - name: Sign, notarize, staple, and verify DMG
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ needs.release-provenance.outputs.version }}
        run: |
          set -euo pipefail
          for value in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_CODESIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "$value is required; refusing an unsigned or unnotarized macOS release" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          scripts/package-macos-dmg.sh "flutter/build/Thing-macOS-v$VERSION.dmg"
          app=flutter/build/macos/Build/Products/Release/Thing.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=4 "$app" 2>&1 | grep -q 'flags=0x10000(runtime)'
          xcrun notarytool submit "flutter/build/Thing-macOS-v$VERSION.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "flutter/build/Thing-macOS-v$VERSION.dmg"
          xcrun stapler validate "flutter/build/Thing-macOS-v$VERSION.dmg"
          shasum -a 256 "flutter/build/Thing-macOS-v$VERSION.dmg"
